spring.application.name=demopractice

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/payment_mgmt
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Generate with: openssl rand -base64 32
jwt.secret=zS3qXeR9tLwYfV2nDc1gBh5jKp0o7iUv6mNl4G8yHrAqWxTdZ+
jwt.expiration=86400


fees:
wallet: 0.03
domestic: 0.05
international: 0.07
peerToPeer: 0.04





# Format SQL statements (more readable)
spring.jpa.properties.hibernate.format_sql=true

# Log SQL bind parameters (very useful!)
spring.jpa.properties.hibernate.type=trace

# Enable Hibernate debug logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

